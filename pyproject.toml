[project]
name = "package-release-provenance-consistency-register"
version = "0.1.0"
description = "Bounded package registry to source-release provenance checks on GenLayer"
requires-python = ">=3.13,<3.14"
dependencies = [
  "cloudpickle==3.1.2",
  "genlayer-py==0.16.3",
  "genlayer-test==0.29.2",
  "genvm-linter==0.11.0",
  "pytest==9.1.1",
]

[dependency-groups]
dev = [
  "pyright==1.1.411",
  "ruff==0.16.0",
]

[tool.uv]
package = false

